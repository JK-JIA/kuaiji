<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>记账本 · 下载</title>
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <p class="eyebrow">批发记账</p>
        <h1>记账本</h1>
        <p class="lede">
          下载各版本 Android 安装包。也可在下方使用上传令牌直接上传 APK，自动写入版本列表。
        </p>
      </header>

      <details class="upload-box" id="upload-box">
        <summary class="upload-summary">上传新版本 APK</summary>
        <p class="upload-hint hidden" id="upload-disabled">
          服务端未配置上传令牌，仅支持在服务器上手动放入 <code>downloads/</code> 并编辑
          <code>releases.json</code>。
        </p>
        <form class="upload-form hidden" id="upload-form">
          <label class="field">
            <span class="label">上传令牌</span>
            <input
              name="token"
              type="password"
              autocomplete="current-password"
              placeholder="与 .env 中 UPLOAD_TOKEN 一致"
              required
            />
          </label>
          <label class="field">
            <span class="label">APK 文件</span>
            <input name="file" type="file" accept=".apk,application/vnd.android.package-archive" required />
          </label>
          <label class="field">
            <span class="label">版本号</span>
            <input name="version" type="text" placeholder="例如 1.0.5" required />
          </label>
          <label class="field">
            <span class="label">日期</span>
            <input name="date" type="date" id="upload-date" />
          </label>
          <label class="field">
            <span class="label">渠道</span>
            <input name="channel" type="text" placeholder="release / debug" />
          </label>
          <label class="field">
            <span class="label">更新说明</span>
            <input name="notes" type="text" placeholder="可选" />
          </label>
          <button type="submit" class="btn-submit">上传并发布</button>
          <p class="upload-msg" id="upload-msg" aria-live="polite"></p>
        </form>
      </details>

      <section class="panel" id="panel">
        <p class="loading" id="loading">加载版本列表…</p>
        <p class="error hidden" id="error"></p>
        <ul class="list hidden" id="list"></ul>
      </section>

      <footer class="foot">
        <p>数据与账号由自建后端服务提供，与本下载页无关。</p>
      </footer>
    </div>
    <script src="/assets/app.js" type="module"></script>
  </body>
</html>
