<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>记账本 · 下载</title>
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <p class="eyebrow">批发记账</p>
        <h1>记账本</h1>
        <p class="lede">
          公开下载各版本 Android 安装包。管理员请在下方的<strong>管理后台</strong>登录后上传或删除版本。
        </p>
      </header>

      <section class="admin-section hidden" id="admin-section" aria-label="管理后台">
        <p class="admin-off hidden" id="admin-off">
          服务端未配置 <code>UPLOAD_TOKEN</code>，仅可在服务器上维护
          <code>downloads/</code> 与 <code>releases.json</code>。
        </p>

        <div class="panel admin-card" id="admin-login-card">
          <h2 class="admin-heading">管理后台</h2>
          <p class="admin-lede">
            输入与服务器环境变量 <code>UPLOAD_TOKEN</code> 一致的令牌，登录后可连续上传多版、并管理已有版本（删除会同步更新列表与服务器文件）。
          </p>
          <form id="login-form" class="stack-form">
            <label class="field">
              <span class="label">上传令牌</span>
              <input
                id="login-token"
                name="token"
                type="password"
                autocomplete="current-password"
                placeholder="登录后保存在本机浏览器（关闭标签页仍有效至关闭浏览器）"
                required
              />
            </label>
            <button type="submit" class="btn-submit">登录</button>
            <p class="form-msg" id="login-msg" aria-live="polite"></p>
          </form>
        </div>

        <div class="panel admin-card hidden" id="admin-panel">
          <div class="admin-panel-head">
            <div>
              <h2 class="admin-heading">版本管理</h2>
              <p class="admin-sub">已登录 · 可多次上传；下方列表可删除历史版本。</p>
            </div>
            <button type="button" class="btn-outline" id="btn-logout">退出登录</button>
          </div>

          <form id="upload-form" class="stack-form upload-form-inner">
            <label class="field">
              <span class="label">APK 文件</span>
              <input
                name="file"
                type="file"
                accept=".apk,application/vnd.android.package-archive"
                required
              />
            </label>
            <label class="field">
              <span class="label">版本号</span>
              <input name="version" type="text" placeholder="例如 1.0.5" required />
            </label>
            <label class="field">
              <span class="label">日期</span>
              <input name="date" type="date" id="upload-date" />
            </label>
            <label class="field">
              <span class="label">渠道</span>
              <input name="channel" type="text" placeholder="release / debug" />
            </label>
            <label class="field">
              <span class="label">更新说明</span>
              <input name="notes" type="text" placeholder="可选" />
            </label>
            <button type="submit" class="btn-submit">上传并发布</button>
            <p class="form-msg" id="upload-msg" aria-live="polite"></p>
          </form>
        </div>
      </section>

      <section class="panel" id="panel">
        <h2 class="panel-title">版本列表</h2>
        <p class="loading" id="loading">加载版本列表…</p>
        <p class="error hidden" id="error"></p>
        <ul class="list hidden" id="list"></ul>
      </section>

      <footer class="foot">
        <p>数据与账号由自建账本后端提供，与本下载页无关。</p>
      </footer>
    </div>
    <script src="/assets/app.js" type="module"></script>
  </body>
</html>
