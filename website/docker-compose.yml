# 官网静态页 + APK 下载 + 带令牌的上传 API。默认 http://<主机>:8080
# 复制 .env.example 为 .env 并设置 UPLOAD_TOKEN 后，网页内可上传 APK
# 镜像使用 DaoCloud 代理，便于国内拉取
#
# ledger-api 与 website 同机 Docker 时：uploader 加入 kuaiji_default，.env 写 LEDGER_API_URL=http://api:3001
# 查网络名：docker inspect $(docker ps -qf name=api) -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
services:
  uploader:
    build:
      context: ./uploader
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      PORT: '3005'
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:-}
      LEDGER_API_URL: ${LEDGER_API_URL:-}
      LEDGER_ADMIN_TOKEN: ${LEDGER_ADMIN_TOKEN:-}
      DOWNLOADS_DIR: /data/downloads
      RELEASES_PATH: /data/public/releases.json
      REPORT_TO_EMAIL: ${REPORT_TO_EMAIL:-jia_jk@163.com}
      REPORT_SMTP_HOST: ${REPORT_SMTP_HOST:-smtp.163.com}
      REPORT_SMTP_PORT: ${REPORT_SMTP_PORT:-465}
      REPORT_SMTP_USER: ${REPORT_SMTP_USER:-}
      REPORT_SMTP_PASS: ${REPORT_SMTP_PASS:-}
      REPORTS_DIR: /data/reports
    volumes:
      - ./downloads:/data/downloads
      - ./public:/data/public
      - ./reports:/data/reports
    networks:
      - default
      - ledger

  web:
    image: docker.m.daocloud.io/library/nginx:alpine
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - uploader
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
      - ./downloads:/var/www/downloads:ro
    networks:
      - default

networks:
  ledger:
    external: true
    name: ${LEDGER_DOCKER_NETWORK:-kuaiji_default}
