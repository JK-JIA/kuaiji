# 官网静态页 + APK 下载目录。默认 http://<主机>:8080
# 镜像使用 DaoCloud 代理，便于国内拉取
services:
  web:
    image: docker.m.daocloud.io/library/nginx:alpine
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # public 只读挂载时，不能再把子目录 downloads 挂进同一路径，故 APK 单独挂到 /var/www/downloads
      - ./public:/usr/share/nginx/html:ro
      - ./downloads:/var/www/downloads:ro
