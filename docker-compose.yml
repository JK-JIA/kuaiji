# 账本 API + MySQL。对外默认 3001；App 的 VITE_API_URL 填 http://<主机IP>:3001
# db / Dockerfile 中 Node 镜像使用 DaoCloud 代理加速国内拉取。
# redeem-daily：每日生成 5 档兑换码（7天/30天/半年/1年/永久），覆盖写入宿主机 ./server/data/redeem-codes/redeem-codes.txt
services:
  db:
    image: docker.m.daocloud.io/library/mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret_change_me
      MYSQL_DATABASE: ledger
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledger
    volumes:
      - ledger_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-prootsecret_change_me',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: mysql://ledger:ledger@db:3306/ledger
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-min-32-characters-long}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-*}
      # 语音识别：控制台「APP ID」→ VOLC_ASR_APP_KEY；「Access Token」→ VOLC_ASR_ACCESS_KEY
      # 在仓库旁建 .env 写入上述变量（勿提交 .env）；或 export 后再 compose up
      VOLC_ASR_APP_KEY: ${VOLC_ASR_APP_KEY:-}
      VOLC_ASR_ACCESS_KEY: ${VOLC_ASR_ACCESS_KEY:-}
      VOLC_ASR_RESOURCE_ID: ${VOLC_ASR_RESOURCE_ID:-volc.seedasr.sauc.duration}
      # 新控制台若只给 X-Api-Key，可只填此项并留空 APP_KEY / ACCESS_KEY
      VOLC_ASR_API_KEY: ${VOLC_ASR_API_KEY:-}
      # 语音智能解析（豆包）：改服务端环境变量即可，无需重打 App 热更包
      DOUBAO_API_KEY: ${DOUBAO_API_KEY:-}
      DOUBAO_MODEL: ${DOUBAO_MODEL:-doubao-seed-1-8-251228}
      DOUBAO_ENDPOINT: ${DOUBAO_ENDPOINT:-https://ark.cn-beijing.volces.com/api/v3/responses}
      # 手机号验证码：RAM AccessKey（需号码认证/短信相关权限）；见 .env.example
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_REGION_ID: ${ALIYUN_REGION_ID:-cn-hangzhou}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      ALIYUN_SMS_TEMPLATE_MIN: ${ALIYUN_SMS_TEMPLATE_MIN:-}
      ANDROID_UPDATE_VERSION_CODE: ${ANDROID_UPDATE_VERSION_CODE:-}
      ANDROID_UPDATE_VERSION_NAME: ${ANDROID_UPDATE_VERSION_NAME:-}
      ANDROID_UPDATE_APK_URL: ${ANDROID_UPDATE_APK_URL:-}
      ANDROID_UPDATE_NOTES: ${ANDROID_UPDATE_NOTES:-}
    depends_on:
      db:
        condition: service_healthy

  redeem-daily:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://ledger:ledger@db:3306/ledger
      REDEEM_CODES_OUTPUT_PATH: /data/redeem-codes.txt
    volumes:
      - ./server/data/redeem-codes:/data
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    entrypoint: ['/bin/sh', '-c']
    # 与 api 相同镜像：启动时再执行 migrate，避免仅用旧 api 起服时库未含新列（如 grantLifetime）
    command:
      - |
        npx prisma migrate deploy
        while true; do
          node scripts/daily-redeem-code.mjs || true
          sleep 86400
        done

volumes:
  ledger_mysql_data:
