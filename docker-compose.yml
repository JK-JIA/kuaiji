# 账本 API + MySQL。对外默认 3001；App 的 VITE_API_URL 填 http://<主机IP>:3001
# db / Dockerfile 中 Node 镜像使用 DaoCloud 代理加速国内拉取。
services:
  db:
    image: docker.m.daocloud.io/library/mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret_change_me
      MYSQL_DATABASE: ledger
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledger
    volumes:
      - ledger_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-prootsecret_change_me',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: mysql://ledger:ledger@db:3306/ledger
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-min-32-characters-long}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-*}
      # 火山流式语音识别（二选一：旧控制台 APP+Token，或新控制台仅 API Key）
      # VOLC_ASR_APP_KEY: "控制台 APP ID"
      # VOLC_ASR_ACCESS_KEY: "控制台 Access Token"
      # VOLC_ASR_RESOURCE_ID: "volc.seedasr.sauc.duration"
      # VOLC_ASR_API_KEY: "新控制台 X-Api-Key"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ledger_mysql_data:
