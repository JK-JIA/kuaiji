# 账本 API + PostgreSQL。对外默认 3001（避免与宿主机 3000 冲突）；VITE_API_URL 填 http://<主机>:3001
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    volumes:
      - ledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://ledger:ledger@db:5432/ledger
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-min-32-characters-long}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-*}
    depends_on:
      db:
        condition: service_healthy

volumes:
  ledger_pgdata:
