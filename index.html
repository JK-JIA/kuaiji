<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      ;(function () {
        var FONT_KEY = 'kuaiji_ui_font_pct'
        var THEME_KEY = 'kuaiji_theme_mode'
        var DEF = 100,
          MIN = 85,
          MAX = 150,
          STEP = 5
        try {
          var raw = localStorage.getItem(FONT_KEY)
          var pct = DEF
          if (raw != null) {
            var n = parseFloat(raw)
            if (Number.isFinite(n)) {
              n = Math.round(n / STEP) * STEP
              if (n >= MIN && n <= MAX) pct = n
            }
          }
          document.documentElement.style.fontSize = pct + '%'
        } catch (e) {}
        try {
          var mode = localStorage.getItem(THEME_KEY)
          var dark =
            mode === 'dark' ||
            (mode !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0c0c0f' : '#f8f9fa')
        } catch (e2) {}
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf9" />
    <title>个人记账</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
